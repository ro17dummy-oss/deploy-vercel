<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="asmoGold" x1="12" y1="8" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="asmoFlame" x1="60" y1="16" x2="60" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="85%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="asmoCore" x1="48" y1="48" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- 4 Diagonal Golden Spear Rays -->
  <g fill="url(#asmoGold)" stroke="#92400E" stroke-width="0.9" stroke-linejoin="round">
    <!-- Top-Left Spear -->
    <path d="M52 52 L19 14 L12 8 L17 21 L47 55 Z" />
    <polygon points="21,19 16,13 24,22" fill="#FEF9C3" stroke="none" />
    <!-- Top-Right Spear -->
    <path d="M68 52 L101 14 L108 8 L103 21 L73 55 Z" />
    <polygon points="99,19 104,13 96,22" fill="#FEF9C3" stroke="none" />
    <!-- Bottom-Left Spear -->
    <path d="M52 68 L19 106 L12 112 L17 99 L47 65 Z" />
    <polygon points="21,101 16,107 24,98" fill="#FEF9C3" stroke="none" />
    <!-- Bottom-Right Spear -->
    <path d="M68 68 L101 106 L108 112 L103 99 L73 65 Z" />
    <polygon points="99,101 104,107 96,98" fill="#FEF9C3" stroke="none" />
  </g>

  <!-- Vertical & Horizontal Golden Cross Halberds -->
  <g fill="url(#asmoGold)" stroke="#92400E" stroke-width="1" stroke-linejoin="round">
    <!-- Top Spire -->
    <path d="M60 4 L67 16 L63 46 L57 46 L53 16 Z" />
    <!-- Bottom Spire -->
    <path d="M60 116 L68 98 L63 72 L57 72 L52 98 Z" />
    <path d="M60 114 L72 104 L64 96 L60 103 L56 96 L48 104 Z" />
    <!-- Left Halberd Crescent -->
    <path d="M12 36 C16 48, 16 72, 12 84 L22 68 L44 63 L44 57 L22 52 Z" />
    <!-- Right Halberd Crescent -->
    <path d="M108 36 C104 48, 104 72, 108 84 L98 68 L76 63 L76 57 L98 52 Z" />
  </g>

  <!-- Inner Golden Ornate Sun-Wheel Lattice -->
  <circle cx="60" cy="60" r="24" fill="none" stroke="url(#asmoGold)" stroke-width="3" />
  <circle cx="60" cy="60" r="16" fill="none" stroke="#FDE047" stroke-width="1.8" stroke-dasharray="5 3" />
  <path d="M60 32 L64 52 L88 60 L64 68 L60 88 L56 68 L32 60 L56 52 Z" fill="url(#asmoGold)" stroke="#92400E" stroke-width="0.8" />

  <!-- Twin Fiery Phoenix / Archon Wreath Wings (Left & Right) -->
  <g fill="url(#asmoFlame)" stroke="#FDE047" stroke-width="0.9" stroke-linejoin="round">
    <!-- Left Fiery Wing Wreath -->
    <path d="M51 22 C43 16, 36 22, 37 30 C30 28, 26 35, 30 42 C23 43, 21 51, 27 57 C21 61, 22 69, 29 73 C25 79, 29 86, 37 86 C39 93, 47 95, 55 89 C48 84, 43 76, 42 66 C37 64, 37 56, 42 54 C43 44, 48 34, 54 29 C54 25, 53 23, 51 22 Z" />
    <!-- Left Inner Flame Feather Details -->
    <path d="M47 28 C41 33, 36 44, 36 56 C36 68, 41 78, 49 84" fill="none" stroke="#FEF08A" stroke-width="1.1" stroke-linecap="round" />

    <!-- Right Fiery Wing Wreath -->
    <path d="M69 22 C77 16, 84 22, 83 30 C90 28, 94 35, 90 42 C97 43, 99 51, 93 57 C99 61, 98 69, 91 73 C95 79, 91 86, 83 86 C81 93, 73 95, 65 89 C72 84, 77 76, 78 66 C83 64, 83 56, 78 54 C77 44, 72 34, 66 29 C66 25, 67 23, 69 22 Z" />
    <!-- Right Inner Flame Feather Details -->
    <path d="M73 28 C79 33, 84 44, 84 56 C84 68, 79 78, 71 84" fill="none" stroke="#FEF08A" stroke-width="1.1" stroke-linecap="round" />
  </g>

  <!-- Central Crimson Diamond Core -->
  <polygon points="60,49 69,60 60,71 51,60" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2" />
  <polygon points="60,53 65,60 60,67 55,60" fill="url(#asmoCore)" />
  <circle cx="60" cy="60" r="2.2" fill="#FEF9C3" />
</svg>
