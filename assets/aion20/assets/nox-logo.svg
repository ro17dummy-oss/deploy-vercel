<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Imperial Gold Metallic Gradient -->
    <linearGradient id="noxGold" x1="16" y1="10" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6E3B4" />
      <stop offset="38%" stop-color="#C9AA71" />
      <stop offset="72%" stop-color="#9A7840" />
      <stop offset="100%" stop-color="#E5C88E" />
    </linearGradient>

    <!-- Balaurea Crimson Ember Core -->
    <linearGradient id="noxCrimson" x1="60" y1="14" x2="60" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5E6C" />
      <stop offset="50%" stop-color="#E03C4B" />
      <stop offset="100%" stop-color="#7F111D" />
    </linearGradient>

    <!-- Obsidian Inner Shield -->
    <linearGradient id="noxDark" x1="60" y1="18" x2="60" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1418" />
      <stop offset="100%" stop-color="#090708" />
    </linearGradient>

    <filter id="noxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E03C4B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Daeva Wings (Left & Right) -->
  <path d="M54 26 L12 18 L24 42 L10 46 L28 64 L18 72 L44 84 L54 74 Z" fill="url(#noxGold)" opacity="0.92" />
  <path d="M66 26 L108 18 L96 42 L110 46 L92 64 L102 72 L76 84 L66 74 Z" fill="url(#noxGold)" opacity="0.92" />

  <!-- Diamond Crest Frame (Tower of Eternity Shield) -->
  <polygon points="60,8 96,36 82,94 60,112 38,94 24,36" fill="url(#noxDark)" stroke="url(#noxGold)" stroke-width="3.2" stroke-linejoin="round" />
  <polygon points="60,15 89,39 77,89 60,104 43,89 31,39" fill="none" stroke="url(#noxCrimson)" stroke-width="1.2" opacity="0.7" />

  <!-- Central Aion Spire / Crimson Crystal -->
  <polygon points="60,14 67,34 60,106 53,34" fill="url(#noxCrimson)" filter="url(#noxGlow)" opacity="0.88" />

  <!-- Custom Engraved "N" + "X" Monogram (NOX AION) -->
  <path d="M40 78 V38 L49 38 L71 67 V38 H80 V78 H71 L49 49 V78 H40 Z" fill="url(#noxGold)" stroke="#0A0809" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Top & Bottom Celestial Stars -->
  <polygon points="60,4 63,11 60,18 57,11" fill="#F6E3B4" />
  <circle cx="60" cy="58" r="3.2" fill="#FFF3D1" />
</svg>
